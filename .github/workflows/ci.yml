name: ci

# Rebuild-era CI: replaces the old milestone/platform workflows
# (m5-platform-matrix, m6h-acceptance, milestone3-linux-sandbox).
# Lean on purpose: fmt + clippy + the workspace test suite. Nothing else.
on:
  pull_request:
  push:
    branches:
      - 'lumen-rebuild/**'
      - 'feat/issue-62-mixed-trust-gate'

permissions:
  contents: read

jobs:
  phase0-confinement:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.1'
      - name: Prepare disposable Linux runner
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap gcc libnode-dev npm python3-cryptography dbus-user-session
          # Only this ephemeral CI runner: use setup-node's exact runtime at the
          # prototype's fixed path. N-API headers do not grant runtime authority.
          sudo install -m755 "$(command -v node)" /usr/bin/node
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          # Existing workspace tests need the same ephemeral-runner setting.
          # lane-vps instead uses its path-bound distro AppArmor bwrap profile.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Native negative paths, quotas, cleanup, independent audit verifier
        working-directory: scripts/rebuild/confinement
        run: python3 -m unittest -v test_runtime test_liveness test_audit
      - run: npm ci --ignore-scripts --no-audit --no-fund && npm test
        working-directory: lumen-integrations/bct-pi-extension
      - run: cargo build -p lumen-server --example phase0_kernel_probe
      - name: Build pinned upstream Pi offline and prove mediated denial
        run: |
          candidate_root="$RUNNER_TEMP/lumen-phase0"
          mkdir "$candidate_root"
          bash scripts/rebuild/build-pinned-pi.sh "$candidate_root/upstream"
          runtime_digest=$(python3 scripts/rebuild/confinement/prepare_pi.py "$candidate_root/upstream/repo" "$candidate_root/runtime")
          python3 scripts/rebuild/confinement/probe_pi.py "$candidate_root/runtime" "$runtime_digest" \
            target/debug/examples/phase0_kernel_probe "$candidate_root/evidence"
          python3 scripts/rebuild/confinement/verify_audit.py \
            "$candidate_root/evidence/kernel-evidence.json" "$candidate_root/evidence/audit-anchor.json"

  phase0-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.1'
      # This includes the ordinary-library launch-denial tests. cfg(test)
      # fake-child helpers are protocol tests, not confinement evidence.
      - run: cargo test -p lumen-server --lib --tests
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: lumen-integrations/bct-pi-extension
      - run: npm run typecheck && npm test
        working-directory: lumen-integrations/bct-pi-extension

  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      # lumen-desktop is excluded: it is the killed Tauri app (obsolete
      # rebuild-era baggage; the integration tree already dropped it from
      # the workspace) and its GTK/GDK/WebKit system deps are not
      # installed on the runner. Do not re-add it.
      - run: cargo clippy --workspace --exclude lumen-desktop --all-targets -- -D warnings
      # The KVM-gated tests (tests/kvm.rs, behind `--features kvm`) are
      # not compiled by the workspace pass above; check them so API
      # drift in the lane-vps suite is caught here. Needs no KVM hardware.
      - run: cargo clippy -p lumen-sandboxd --all-targets --features kvm -- -D warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      # Bubblewrap is required by the sandbox test suites
      # (lumen-cli readiness, lumen-integrations extension_process/local_executors).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap python3-cryptography
      - name: Independently verify authority contract fixtures
        run: python3 scripts/rebuild/verify_authority_fixtures.py
      - run: bwrap --version
      # Ubuntu 24.04 (what ubuntu-latest runs) restricts unprivileged user
      # namespaces via AppArmor (kernel.apparmor_restrict_unprivileged_userns=1
      # by default). Bubblewrap's --unshare-user then fails with
      # "setting up uid map: Permission denied", the sandbox probe reports
      # unavailable, and the readiness tests fail. The sandbox profile under
      # test requires a user namespace by design, so relax the restriction
      # for this ephemeral runner (it is discarded after the job). On
      # persistent hosts, prefer a narrow AppArmor profile granting `userns`
      # to /usr/bin/bwrap instead of the blanket sysctl.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Fail fast with a clear signal if the sandbox probe's prerequisites
      # are not met, instead of surfacing it as readiness test failures.
      # NOTE: bwrap pivot_roots into an empty tmpfs, so the probe binary
      # must be reachable via explicit --ro-bind mounts: a bare
      # `bwrap --unshare-user /bin/true` fails with ENOENT even when user
      # namespaces work fine. /lib and /lib64 carry the dynamic loader
      # (symlinks into /usr on merged-/usr systems).
      - run: bwrap --ro-bind /usr /usr --ro-bind /lib /lib --ro-bind /lib64 /lib64 --unshare-user /usr/bin/true && echo "bwrap userns probe OK"
      # lumen-acceptance is excluded: it is a 10m+ end-to-end suite that has
      # not been stabilized for CI yet. Do not re-add it until it is run and
      # green on its own.
      #
      # fuel_deadline_and_cancellation_interrupt_guest_code is skipped: it
      # hangs intermittently (idle, zero CPU -- a never-firing wait inside the
      # wasmtime epoch/deadline machinery) instead of failing, which would burn
      # the whole job timeout. Observed 2026-09-24 on the phase-6 tree.
      # Re-enable once root-caused; see crates/lumen-integrations/src/extension_wasm.rs.
      - run: >
          cargo test --workspace --exclude lumen-acceptance --exclude lumen-desktop --
          --skip fuel_deadline_and_cancellation_interrupt_guest_code
      # The no-default-features configuration is materially different
      # (default features pull in model-client, native-secrets, and
      # wasm-host): the sandbox gate must keep covering it, or a
      # minimal-feature build can regress silently.
      - run: bash scripts/verify-linux-plugin-sandbox.sh

  discord-feature-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      # The discord adapter lives behind a feature flag: the default
      # workspace run never enables it, so it gets its own step.
      - run: cargo test -p lumen-messaging --features discord
