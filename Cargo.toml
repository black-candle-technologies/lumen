[workspace]
members = [
    "crates/lumen-cli",
    "crates/lumen-core",
    "crates/lumen-db",
    "crates/lumen-extension-sdk",
    "crates/lumen-integrations",
    "crates/lumen-server",
    "crates/lumen-worker-runtime",
    "crates/lumen-control-plane",
    "crates/lumen-acceptance",
    "crates/lumen-protocol",
    "crates/lumen-sandboxd",
    "crates/lumen-messaging",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
