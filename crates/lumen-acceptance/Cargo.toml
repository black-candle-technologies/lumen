[package]
name="lumen-acceptance"
version="0.1.0"
edition="2024"
[dependencies]
lumen-core={path="../lumen-core"}
lumen-integrations={path="../lumen-integrations"}
serde={version="1",features=["derive"]}
serde_json="1"
tokio={version="1",features=["io-util","macros","net","rt-multi-thread","time"]}
tokio-util="0.7"

[dev-dependencies]
tempfile="3"
uuid={version="1",features=["v4"]}
