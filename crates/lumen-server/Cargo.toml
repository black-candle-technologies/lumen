[package]
name = "lumen-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
futures-util = "0.3"
hex = "0.4"
libc = "0.2"
lumen-core = { path = "../lumen-core" }
lumen-db = { path = "../lumen-db" }
lumen-sandboxd = { path = "../lumen-sandboxd" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "process", "sync", "time", "macros", "rt"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
uuid = "1"
zeroize = "1"

[dev-dependencies]
http-body-util = "0.1"
lumen-db = { path = "../lumen-db" }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tower = { version = "0.5", features = ["util"] }
