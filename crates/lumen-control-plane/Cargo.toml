[package]
name = "lumen-control-plane"
version = "0.1.0"
edition = "2024"

[dependencies]
lumen-core = { path = "../lumen-core" }
lumen-db = { path = "../lumen-db" }
lumen-integrations = { path = "../lumen-integrations" }
lumen-server = { path = "../lumen-server" }
lumen-worker-runtime = { path = "../lumen-worker-runtime" }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
